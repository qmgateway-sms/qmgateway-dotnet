# Publishes the .NET SDK to nuget.org when a version tag is pushed, using NuGet TRUSTED PUBLISHING: the workflow trades its GitHub identity
# for a short-lived, single-use API key (no stored key).
#
# One-time setup, by a person with MFA:
#   1. On nuget.org, open your account, "Trusted Publishing", and add a policy for this repository, workflow "release-nuget.yml"
#      and environment "release".
#   2. Store your nuget.org USER NAME (not a key) as the repository secret NUGET_USER.
#   3. On GitHub, create the protected environment "release" that needs a person's approval.
# Actions are pinned to full commit hashes (the tag is in the comment); Dependabot proposes updates.
name: Release to NuGet
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release                   # a person approves each release
    permissions:
      contents: read
      id-token: write                      # lets nuget.org verify this exact workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Check the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ] || { echo "Use an annotated, signed tag (git tag -s). Refusing to publish."; exit 1; }
          sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          ok=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${sha}" | jq -r '.verification.verified')
          [ "$ok" = "true" ] || { echo "GitHub does not show this tag as Verified. Refusing to publish."; exit 1; }
      - name: The changelog entry for this version is dated
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v."; exit 1; }
          if grep -q "^## $v (unreleased)" CHANGELOG.md; then echo "Replace '(unreleased)' with the release date (YYYY-MM-DD) in CHANGELOG.md."; exit 1; fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - run: git clone --depth 1 https://github.com/qmgateway-sms/qmgateway-contract.git tests/contract
      - run: dotnet run --project tests/QMGateway.Tests -c Release
      - run: dotnet pack src/QMGateway -c Release -o artifacts /p:ContinuousIntegrationBuild=true
      - run: dotnet pack src/QMGateway.Cli -c Release -o artifacts /p:ContinuousIntegrationBuild=true
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with: { user: '${{ secrets.NUGET_USER }}' }
      - run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
